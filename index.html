<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Delhi Dino</title>
<style>
  html, body { margin: 0; background: #f7f7f7; color: #535353; font-family: "Courier New", Courier, monospace; }
  body { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  canvas { width: min(100vw - 32px, 1200px); height: auto; image-rendering: pixelated; image-rendering: crisp-edges; cursor: pointer; }
  p { font-size: 13px; margin: 14px 16px 0; text-align: center; line-height: 1.5; }
  small { opacity: .6; }
  .credit { margin-top: 10px; font-size: 12px; letter-spacing: .08em; opacity: .7; }
</style>
</head>
<body>
<canvas id="c" width="600" height="150"></canvas>
<p>
  SPACE / ↑ / tap to jump the Delhi Police barricades.<br>
  Every barricade you clear closes the gap. Get within reach and the dino catches them.<br>
  <small>A spoof of the Chrome offline dino. Satire, obviously.</small>
</p>
<p class="credit">created by adz_25</p>
<script>
'use strict';
const W = 600, H = 150, GROUND = 130, S = 2;
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');

// ---------- pixel sprites ----------
const PAL = {
  X: '#535353', // dino / outlines
  w: '#f2f2f2', // white hair & beard
  G: '#d4d4d4', // grey beard
  s: '#e3b07a', // skin
  b: '#222222', // dark hair / eyes
  c: '#fff6e3', // kurta
  o: '#f0892b', // saffron jacket
  n: '#27385f', // navy jacket
  k: '#3a2a1c', // shoes
  g: '#1a1a1a', // glasses
  // background cops (muted so they read as background)
  p: '#8f8560', // cap
  S: '#e9cfa8', // face
  u: '#c8b98e', // khaki uniform
  l: '#8a6a3a', // lathi
  K: '#5a4a3a', // boots
};
function sprite(rows) {
  const h = rows.length, w = rows[0].length;
  rows.forEach(r => { if (r.length !== w) throw new Error('bad sprite row: ' + r); });
  const o = document.createElement('canvas');
  o.width = w * S; o.height = h * S;
  const g = o.getContext('2d');
  rows.forEach((r, y) => [...r].forEach((ch, x) => {
    if (ch === '.') return;
    g.fillStyle = PAL[ch];
    g.fillRect(x * S, y * S, S, S);
  }));
  return o;
}

const DINO_BODY = [
  '..........XXXXXXXXXX',
  '.........XX.XXXXXXXX',
  '.........XXXXXXXXXXX',
  '.........XXXXXXXXXXX',
  '.........XXXXXXXXXXX',
  '.........XXXXXX.....',
  '.........XXXXXXXXX..',
  'X.......XXXX........',
  'X......XXXXXXXX.....',
  'XX....XXXXXXXXXX....',
  'XXX..XXXXXXXXXX.X...',
  'XXXXXXXXXXXXXXX.....',
  '.XXXXXXXXXXXXXX.....',
  '..XXXXXXXXXXXX......',
  '...XXXXXXXXXX.......',
  '....XXXXXXXX........',
  '.....XXXXXX.........',
];
const DINO_LEGS = {
  stand: ['.....XX..XX.........', '.....X...X..........', '.....XX..XX.........'],
  run1:  ['.....XX..XX.........', '.....XX...X.........', '..........XX........'],
  run2:  ['.....XX..XX.........', '.....X...XX.........', '....XX..............'],
};

// Narendra Modi: white hair swept back, full white beard, cream kurta + saffron Nehru jacket
const MODI_BODY = [
  '......wwwwwwww......',
  '....wwwwwwwwwww.....',
  '...wwwwwwwwwwwww....',
  '...wwwwssssssss.....',
  '...wwwssssssssss....',
  '...wwwsssbssbsss....',
  '...wwwssssssssss....',
  '....wwsssssssss.....',
  '....wwssssssssw.....',
  '....wwwsssssww......',
  '....wwwwsswwww......',
  '.....wwwwwwww.......',
  '......wwwwww........',
  '.......ccccc........',
  '....oooccccooo......',
  '...ooooccccoooo.....',
  '...ooooccccoooos....',
  '..s.oooccccooo......',
  '....oooccccooo......',
  '....oooooooooo......',
  '....cccccccccc......',
  '....cccccccccc......',
  '....cccccccccc......',
  '....cccccccccc......',
];
const MODI_LEGS = {
  stand: ['....cccc..cccc......', '....cccc..cccc......', '....kkkk..kkkk......', '...kkkk....kkkk.....'],
  run1:  ['...cccc....cccc.....', '..cccc......cccc....', '.kkkk........kkkk...', '....................'],
  run2:  ['......cccccccc......', '.......cccccc.......', '.......kkkkkk.......', '....................'],
};

// Amit Shah: black hair, thick-rimmed glasses, grey beard, stockier, white kurta + navy jacket
const SHAH_BODY = [
  '.......bbbbbbb........',
  '.....bbbbbbbbbb.......',
  '....bbbbbbbbbbbb......',
  '....bbbssssssssss.....',
  '....bbssssssssssss....',
  '....bbsggggsggggss....',
  '....bbsgssgsgssgss....',
  '....bbsggggsggggss....',
  '....bssssssssssss.....',
  '....GGsssssssssssG....',
  '....GGGssssssssGGG....',
  '....GGGGssssssGGGG....',
  '.....GGGGGGGGGGGG.....',
  '......GGGGGGGGGG......',
  '........cccccc........',
  '....nnnnccccccnnnn....',
  '...nnnnnccccccnnnnn...',
  '...nnnnnccccccnnnnns..',
  '..s.nnnnccccccnnnnn...',
  '....nnnnccccccnnnn....',
  '....nnnnnnnnnnnnnn....',
  '....cccccccccccccc....',
  '....cccccccccccccc....',
  '....cccccccccccccc....',
];
const SHAH_LEGS = {
  stand: ['....ccccc....ccccc....', '....ccccc....ccccc....', '....kkkkk....kkkkk....', '...kkkkk......kkkkk...'],
  run1:  ['...ccccc......ccccc...', '..ccccc........ccccc..', '.kkkkk..........kkkkk.', '......................'],
  run2:  ['......cccccccccc......', '.......cccccccc.......', '.......kkkkkkkk.......', '......................'],
};
const COP = [
  '....pppp....',
  '...pppppp...',
  '....SSSS....',
  '....SSSS....',
  '...uuuuuu..l',
  '..uuuuuuuu.l',
  '..uuuuuuuu.l',
  '..u.uuuu.u.l',
  '....uuuu...l',
  '....uuuu...l',
  '....uuuu....',
  '....uu.uu...',
  '....uu.uu...',
  '....uu.uu...',
  '...KK..KK...',
];
const CLOUD = [
  '.....XXXXX........',
  '....X.....X.......',
  '...X.......XXXX...',
  '..X............X..',
  '.X..............X.',
  'XXXXXXXXXXXXXXXXXX',
];
const frames = (body, legs) => ({ stand: sprite(body.concat(legs.stand)), run1: sprite(body.concat(legs.run1)), run2: sprite(body.concat(legs.run2)) });
const SPR = { dino: frames(DINO_BODY, DINO_LEGS), modi: frames(MODI_BODY, MODI_LEGS), shah: frames(SHAH_BODY, SHAH_LEGS), cloud: sprite(CLOUD), cop: sprite(COP) };
const FUG_H = SPR.modi.stand.height; // 56

const LINES = {
  modi: ['Mitron... bhaago!', 'Main nahi rukunga!', 'Yeh dino kaun hai?'],
  shah: ['Chronology samajhiye!', 'Aur barricade lagao!', 'Section 144 lagao!'],
};

// ---------- game state ----------
const G = {};
function reset() {
  G.state = 'title';          // title | playing | over | won
  G.t = 0; G.endT = 0;
  G.speed = 6;
  G.score = 0;
  G.hi = G.hi || 0;
  G.gap = 300;                // px between dino and the fugitives
  G.dino = { x: 50, y: GROUND - 40, vy: 0, ground: true };
  G.obs = [];
  G.clouds = [{ x: 420, y: 30 }, { x: 150, y: 50 }];
  G.bits = [];
  G.bgX = 480;
  G.bg = [{ type: 'cops', x: 230, n: 3 }, { type: 'bus', x: 560 }];
  G.fug = [
    { who: 'shah', dx: 0, y: 0, vy: 0, ground: true, angle: 0 },
    { who: 'modi', dx: 50, y: 0, vy: 0, ground: true, angle: 0 },
  ];
  G.bubble = null;
  G.nextBubble = 120;
  G.pops = [];
  for (let i = 0; i < 12; i++) G.bits.push({ x: Math.random() * W, y: GROUND + 4 + Math.random() * 10, w: 2 + Math.random() * 5 });
}
reset();

function jump() {
  if (G.dino.ground) { G.dino.vy = -9.5; G.dino.ground = false; }
}
function start() { G.state = 'playing'; G.t = 0; jump(); }
function action() {
  if (G.state === 'title') start();
  else if (G.state === 'playing') jump();
  else if (G.t - G.endT > 25) { reset(); start(); }
}

function spawnObstacle() {
  const r = Math.random();
  let o;
  if (r < 0.45) o = { units: 1, tall: false };
  else if (r < 0.75) o = { units: 1, tall: true };
  else if (G.speed >= 7) o = { units: 2, tall: false };
  else o = { units: 1, tall: false };
  o.w = o.units * 60 + (o.units - 1) * 4;
  o.h = o.tall ? 44 : 30;
  o.x = W + 10;
  o.passed = false;
  G.obs.push(o);
}
function bgWidth(item) { return item.type === 'bus' ? 112 : item.n * 22; }
function scrollBackground(k) {
  G.bgX -= k * 0.15; if (G.bgX < -90) G.bgX = W + 60;
  for (const it of G.bg) it.x -= k * 0.4;
  G.bg = G.bg.filter(it => it.x + bgWidth(it) > -10);
  const last = G.bg[G.bg.length - 1];
  if (!last || last.x + bgWidth(last) < W - 120 - Math.random() * 160) {
    G.bg.push(Math.random() < 0.55 ? { type: 'cops', x: W + 10, n: 2 + Math.floor(Math.random() * 3) } : { type: 'bus', x: W + 10 });
  }
}

function fugX(f) { return Math.min(G.dino.x + G.gap, 520) + f.dx; }

function step() {
  G.t++;
  const d = G.dino;
  // dino physics
  if (!d.ground) {
    d.vy += 0.5; d.y += d.vy;
    if (d.y >= GROUND - 40) { d.y = GROUND - 40; d.vy = 0; d.ground = true; }
  }
  // fugitives bob/hop
  for (const f of G.fug) {
    if (!f.ground) { f.vy += 0.5; f.y += f.vy; if (f.y >= 0) { f.y = 0; f.vy = 0; f.ground = true; } }
    if (G.state === 'won') { f.angle = Math.min(Math.PI / 2, f.angle + 0.12); }
  }
  if (G.state !== 'playing') {
    if (G.state === 'title') scrollBackground(1.2);
    return;
  }

  G.speed = Math.min(13, 6 + G.score / 150);
  G.score += G.speed * 0.03;
  G.gap -= 0.02;

  // scroll
  scrollBackground(G.speed);
  for (const c of G.clouds) c.x -= G.speed * 0.3;
  G.clouds = G.clouds.filter(c => c.x > -40);
  if (G.clouds.length < 3 && Math.random() < 0.01) G.clouds.push({ x: W + 10, y: 20 + Math.random() * 50 });
  for (const b of G.bits) { b.x -= G.speed; if (b.x < -10) { b.x = W + Math.random() * 40; b.y = GROUND + 4 + Math.random() * 10; } }

  // obstacles
  for (const o of G.obs) o.x -= G.speed;
  G.obs = G.obs.filter(o => o.x + o.w > -10);
  const last = G.obs[G.obs.length - 1];
  const minGap = 230 + G.speed * 12;
  if (!last || last.x + last.w < W - minGap - Math.random() * 220) { if (G.t > 40) spawnObstacle(); }

  // fugitives hop over barricades (cosmetic)
  for (const f of G.fug) {
    const fx = fugX(f);
    for (const o of G.obs) if (f.ground && o.x > fx + 10 && o.x < fx + 10 + G.speed * 4) { f.vy = -6.5; f.ground = false; }
  }

  // passing & collision
  for (const o of G.obs) {
    if (!o.passed && o.x + o.w < d.x) { o.passed = true; G.gap -= 15; G.pops.push({ x: d.x + 40, y: d.y - 6, t: 0 }); }
    const hit = d.x + 8 < o.x + o.w - 2 && d.x + 36 > o.x + 2 && d.y + 40 > GROUND - o.h + 2 && d.y + 6 < GROUND;
    if (hit) { G.state = 'over'; G.endT = G.t; G.bubble = null; G.hi = Math.max(G.hi, Math.floor(G.score)); return; }
  }
  G.pops = G.pops.filter(p => ++p.t < 30);

  // speech bubbles
  if (--G.nextBubble <= 0) {
    const f = G.fug[Math.random() < 0.5 ? 0 : 1];
    const lines = LINES[f.who];
    G.bubble = { f, text: lines[Math.floor(Math.random() * lines.length)], t: 100 };
    G.nextBubble = 220 + Math.random() * 200;
  }
  if (G.bubble && --G.bubble.t <= 0) G.bubble = null;

  // caught?
  if (G.gap <= 60) {
    G.state = 'won'; G.endT = G.t; G.gap = 60; G.bubble = null;
    G.hi = Math.max(G.hi, Math.floor(G.score));
    for (const f of G.fug) { f.y = 0; f.ground = true; }
    G.fug[1].dx = 62; // space them out so they do not overlap once toppled
  }
}

// ---------- rendering ----------
function pad(n) { return String(Math.floor(n)).padStart(5, '0'); }

function drawIndiaGate(x) {
  ctx.fillStyle = '#e3e3e3';
  ctx.fillRect(x, GROUND - 56, 64, 56);
  ctx.fillRect(x - 4, GROUND - 58, 72, 5);
  ctx.fillRect(x + 22, GROUND - 68, 20, 12);
  ctx.fillStyle = '#f7f7f7';
  ctx.fillRect(x + 20, GROUND - 30, 24, 30);
  ctx.beginPath(); ctx.arc(x + 32, GROUND - 30, 12, Math.PI, 0); ctx.fill();
  ctx.fillRect(x + 4, GROUND - 48, 6, 8); ctx.fillRect(x + 54, GROUND - 48, 6, 8);
}

// orange Delhi cluster bus, parked in the far lane
function drawBus(x) {
  const bw = 112, bh = 36, top = GROUND - 4 - bh;
  ctx.fillStyle = '#ef7d1f'; ctx.fillRect(x, top, bw, bh);
  ctx.fillStyle = '#d96a12'; ctx.fillRect(x, top + bh - 8, bw, 8);           // skirt
  ctx.fillStyle = '#cfe6ee';                                                 // windows
  for (let i = 0; i < 6; i++) ctx.fillRect(x + 6 + i * 17, top + 6, 13, 12);
  ctx.fillRect(x + bw - 10, top + 6, 8, 20);                                 // front windscreen
  ctx.fillStyle = '#ffffff'; ctx.font = 'bold 6px monospace'; ctx.textAlign = 'left';
  ctx.fillText('DTC  DELHI', x + 8, top + bh - 2);
  ctx.fillStyle = '#2a2a2a';                                                 // wheels
  ctx.fillRect(x + 14, GROUND - 8, 12, 8); ctx.fillRect(x + bw - 30, GROUND - 8, 12, 8);
  ctx.fillStyle = '#f0a000'; ctx.fillRect(x + bw - 3, top + bh - 14, 3, 4);  // indicator
}
function drawCops(x, n) {
  for (let i = 0; i < n; i++) ctx.drawImage(SPR.cop, Math.round(x + i * 22), GROUND - 4 - SPR.cop.height);
}

function barricadeUnit(x, w, top, tall) {
  const ph = 18;
  let py = top;
  if (tall) {
    ctx.fillStyle = '#ffffff'; ctx.fillRect(x + 6, top, w - 12, 12);
    ctx.strokeStyle = '#c0392b'; ctx.lineWidth = 1; ctx.strokeRect(x + 6.5, top + .5, w - 13, 11);
    ctx.fillStyle = '#c0392b'; ctx.font = 'bold 7px monospace'; ctx.textAlign = 'center';
    ctx.fillText('ROAD CLOSED', x + w / 2, top + 9);
    ctx.fillStyle = '#535353'; ctx.fillRect(x + w / 2 - 1, top + 12, 2, 2);
    py = top + 14;
  }
  ctx.fillStyle = '#f2c230'; ctx.fillRect(x, py, w, ph);
  ctx.fillStyle = '#535353'; ctx.fillRect(x, py, w, 3); ctx.fillRect(x, py + ph - 2, w, 2);
  ctx.fillStyle = '#1d4f9e'; ctx.fillRect(x + 3, py + 5, w - 6, 9);
  ctx.fillStyle = '#ffffff'; ctx.font = 'bold 7px monospace'; ctx.textAlign = 'center';
  ctx.fillText('DELHI POLICE', x + w / 2, py + 12);
  const by = py + ph;
  ctx.strokeStyle = '#535353'; ctx.lineWidth = 3; ctx.beginPath();
  for (const lx of [x + 9, x + w - 9]) {
    ctx.moveTo(lx, by); ctx.lineTo(lx - 6, GROUND);
    ctx.moveTo(lx, by); ctx.lineTo(lx + 6, GROUND);
  }
  ctx.stroke();
  ctx.fillStyle = '#f2c230'; ctx.fillRect(x + 3, GROUND - 5, w - 6, 2);
}
function drawBarricade(o) {
  const uw = 60, top = GROUND - o.h;
  for (let i = 0; i < o.units; i++) barricadeUnit(o.x + i * (uw + 4), uw, top, o.tall);
}

function bubble(text, x, y) {
  ctx.font = 'bold 7px monospace'; ctx.textAlign = 'left';
  const tw = ctx.measureText(text).width + 8, th = 12;
  let bx = Math.min(x - tw / 2, W - tw - 2); bx = Math.max(2, bx);
  const by = y - th - 6;
  ctx.fillStyle = '#fff'; ctx.strokeStyle = '#535353'; ctx.lineWidth = 1;
  ctx.fillRect(bx, by, tw, th); ctx.strokeRect(bx + .5, by + .5, tw - 1, th - 1);
  ctx.beginPath(); ctx.moveTo(x - 3, by + th); ctx.lineTo(x + 3, by + th); ctx.lineTo(x, by + th + 5); ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#535353'; ctx.fillText(text, bx + 4, by + 9);
}

function render() {
  ctx.fillStyle = '#f7f7f7'; ctx.fillRect(0, 0, W, H);
  ctx.imageSmoothingEnabled = false;

  // far background
  drawIndiaGate(G.bgX);
  for (const c of G.clouds) ctx.drawImage(SPR.cloud, Math.round(c.x), c.y);
  // near background: parked buses and cops on duty, softened so the action stays readable
  ctx.globalAlpha = 0.8;
  for (const it of G.bg) it.type === 'bus' ? drawBus(Math.round(it.x)) : drawCops(it.x, it.n);
  ctx.globalAlpha = 1;

  // ground
  ctx.fillStyle = '#535353'; ctx.fillRect(0, GROUND, W, 1);
  for (const b of G.bits) ctx.fillRect(Math.round(b.x), Math.round(b.y), b.w, 1);

  for (const o of G.obs) drawBarricade(o);

  // fugitives
  const runFrame = (Math.floor(G.t / 6) % 2 ? 'run1' : 'run2');
  for (const f of G.fug) {
    const spr = SPR[f.who];
    const img = G.state === 'playing' ? (f.ground ? spr[runFrame] : spr.stand) : spr.stand;
    const x = Math.round(fugX(f)), y = GROUND - img.height + Math.round(f.y);
    if (f.angle > 0) {
      // fall backwards: pivot at the feet, end up lying on the ground
      ctx.save(); ctx.translate(x, GROUND); ctx.rotate(-f.angle);
      ctx.drawImage(img, 0, -img.height); ctx.restore();
    } else ctx.drawImage(img, x, y);
  }
  if (G.bubble) { const f = G.bubble.f; bubble(G.bubble.text, Math.round(fugX(f)) + 20, GROUND - FUG_H - 2 + Math.round(f.y)); }

  // dino
  const d = G.dino;
  const dImg = G.state === 'playing' && d.ground ? SPR.dino[runFrame] : SPR.dino.stand;
  ctx.drawImage(dImg, d.x, Math.round(d.y));
  if (G.state === 'won') bubble('GOTCHA.', d.x + 30, d.y - 2);
  if (G.state === 'over') { ctx.fillStyle = '#f7f7f7'; ctx.fillRect(d.x + 18, d.y + 2, 4, 4); ctx.fillStyle = '#535353'; ctx.fillRect(d.x + 19, d.y + 3, 2, 2); }

  // pops
  ctx.font = 'bold 8px monospace'; ctx.textAlign = 'left'; ctx.fillStyle = '#535353';
  for (const p of G.pops) if (p.t % 6 < 4) ctx.fillText('-15m', p.x, p.y - p.t * 0.5);

  // HUD
  ctx.font = '11px monospace'; ctx.fillStyle = '#535353';
  ctx.textAlign = 'right'; ctx.fillText('HI ' + pad(G.hi) + '  ' + pad(G.score), W - 10, 18);
  ctx.textAlign = 'left'; ctx.fillText('GAP ' + Math.max(0, Math.round(G.gap - 60)) + 'm', 10, 18);

  // credit
  ctx.font = '8px monospace'; ctx.textAlign = 'right'; ctx.fillStyle = '#9a9a9a';
  ctx.fillText('created by adz_25', W - 6, H - 4);

  // overlays
  ctx.textAlign = 'center'; ctx.fillStyle = '#535353';
  if (G.state === 'title') {
    ctx.font = 'bold 14px monospace'; ctx.fillText('DELHI DINO', W / 2, 52);
    ctx.font = '9px monospace'; ctx.fillText('they are running. you are hungry. press SPACE / tap', W / 2, 68);
  } else if (G.state === 'over') {
    ctx.font = 'bold 14px monospace'; ctx.fillText('D E T A I N E D', W / 2, 52);
    ctx.font = '9px monospace'; ctx.fillText('Delhi Police got you first. SPACE to try again', W / 2, 68);
  } else if (G.state === 'won') {
    ctx.font = 'bold 14px monospace'; ctx.fillText('C A U G H T !', W / 2, 52);
    ctx.font = '9px monospace'; ctx.fillText('score ' + Math.floor(G.score) + ' · SPACE to run it back', W / 2, 68);
  }
}

// ---------- loop & input ----------
let last = 0, acc = 0, paused = false;
function loop(ts) {
  if (!paused) {
    acc += Math.min(ts - last, 100); last = ts;
    while (acc >= 1000 / 60) { step(); acc -= 1000 / 60; }
    render();
  }
  requestAnimationFrame(loop);
}
requestAnimationFrame(ts => { last = ts; loop(ts); });

window.addEventListener('keydown', e => {
  if (e.code === 'Space' || e.code === 'ArrowUp') { e.preventDefault(); action(); }
});
cv.addEventListener('pointerdown', e => { e.preventDefault(); action(); });

// ---------- demo capture (used to record the GIF) ----------
window.__capture = function (opts) {
  const { every = 3, max = 400, gap = 180 } = opts || {};
  paused = true;
  reset(); G.gap = gap; start();
  const out = [];
  for (let n = 0; out.length < max; n++) {
    if (G.state === 'playing') {
      const o = G.obs.find(o => o.x + o.w > G.dino.x);
      if (o && G.dino.ground && o.x - G.dino.x < 30 + G.speed * 8) jump();
    }
    step(); render();
    if (n % every === 0) out.push(cv.toDataURL('image/png'));
    if (G.state === 'won' && G.t - G.endT > 80) break;
    if (G.state === 'over' && G.t - G.endT > 50) break;
  }
  window.__result = { state: G.state, score: Math.floor(G.score), frames: out.length };
  paused = false; reset();
  return out;
};
if (new URLSearchParams(location.search).has('capture')) {
  window.addEventListener('load', async () => {
    const frames = window.__capture();
    const r = await fetch('/frames', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(frames) });
    document.title = 'captured ' + frames.length + ' (' + await r.text() + ')';
  });
}
</script>
